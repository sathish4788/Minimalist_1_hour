<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MinimaList - 1-Hour Reminder To-Do</title>
    <meta name="description" content="Minimalist, distraction-free to-do list that automatically schedules a 1-hour reminder for every new task, with flexible settings, audio chimes, and browser notifications." />
    <meta property="og:title" content="MinimaList - 1-Hour Reminder To-Do" />
    <meta property="og:description" content="Minimalist, distraction-free to-do list that automatically schedules a 1-hour reminder for every new task, with flexible settings, audio chimes, and browser notifications." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0B0F17" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MinimaList" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json?v=3" crossorigin="use-credentials" />
    <meta name="application-name" content="MinimaList" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      window.__deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-available'));
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(function(reg) {
            console.log('MinimaList Service Worker registered with scope:', reg.scope);
            if (reg.installing) {
              reg.installing.addEventListener('statechange', function() {
                if (this.state === 'activated') {
                  console.log('Service Worker activated and controlling scope');
                }
              });
            }
          })
          .catch(function(err) {
            console.warn('Service Worker registration skipped or failed:', err);
          });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
